<style id="dashboard-inline-styles">
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
:root {

  --gold:#C9973A; --cream:#FFFDF9; --bg:#F6F4F0; --bg2:#EFEBE3; --surface:#FFF; --surface-2:#FAF8F4;
  --border:#E4DDD5; --border-light:#F0EBE5; --border-strong:#D6CCC0; --ink:#1E140E; --ink2:#4A3728; --ink3:#7A6558; --ink4:#A8998E; --ink5:#D5C8BC;
  --blue:#1D6FAE; --blue-bg:#EBF5FB; --green:#1E8A4C; --green-bg:#EDFBF3; --red:#C0392B; --red-bg:#FFF0EF; --amber:#B7770D; --amber-bg:#FFF8E6;
  --radius:8px; --radius-md:12px; --radius-lg:16px; --header-h:60px; --sidebar-w:252px;
  --shadow-sm:0 1px 3px rgba(30,20,14,.08),0 1px 2px rgba(30,20,14,.04); --shadow-md:0 4px 16px rgba(30,20,14,.08),0 2px 6px rgba(30,20,14,.04); --transition-fast:.12s ease;
}
input, button, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; }
.field { margin-bottom:18px; }
.field label { display:block; font-size:13px; font-weight:600; color:var(--ink2); margin-bottom:6px; }
.field input, .field textarea, .field select { width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:var(--radius); font-size:14px; color:var(--ink); background:var(--cream); outline:none; transition:border-color var(--transition-fast),background var(--transition-fast),box-shadow var(--transition-fast); }
.field input:focus, .field textarea:focus, .field select:focus { border-color:var(--saffron); background:#fff; box-shadow:0 0 0 3px rgba(232,115,42,.12); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 16px; border-radius:var(--radius); font-size:14px; font-weight:600; border:none; transition:all var(--transition-fast); white-space:nowrap; }
.btn-primary { background:var(--saffron); color:#fff; } .btn-primary:hover:not(:disabled) { background:var(--saffron-dark); }
.btn-ghost { background:transparent; color:var(--ink2); border:1.5px solid var(--border); } .btn-ghost:hover { background:var(--bg); border-color:var(--border-strong); }
.btn-secondary { background:var(--bg); color:var(--ink2); border:1.5px solid var(--border); }
.btn-sm { padding:6px 12px; font-size:13px; } .btn-xs { padding:4px 10px; font-size:12px; }
.icon-btn { width:36px; height:36px; border-radius:var(--radius); background:transparent; border:1.5px solid transparent; color:var(--ink3); display:inline-flex; align-items:center; justify-content:center; }
.icon-btn:hover { background:var(--bg); color:var(--ink); border-color:var(--border-light); }
.alert { padding:11px 14px; border-radius:var(--radius); font-size:13px; margin-bottom:16px; }
.alert-error { background:var(--red-bg); color:var(--red); border:1px solid #FFCDD1; }
#app { display:none; flex-direction:column; height:100vh; } #app.visible { display:flex; }
.topbar { height:var(--header-h); background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 20px; gap:16px; position:sticky; top:0; z-index:50; flex-shrink:0; }
.topbar-brand, .topbar-actions, .user-chip { display:flex; align-items:center; }
.topbar-brand { gap:10px; } .topbar-brand-text { line-height:1.2; } .topbar-title { font-weight:700; font-size:15px; } .topbar-sub { font-size:11px; color:var(--ink3); }
.brand-mark { width:36px; height:36px; border-radius:9px; background:linear-gradient(135deg,var(--saffron),var(--saffron-dark)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; }
.breadcrumb { flex:1; display:flex; align-items:center; gap:8px; margin-left:20px; font-size:13px; color:var(--ink3); } .breadcrumb-sep { color:var(--ink5); } .breadcrumb-current { color:var(--ink); font-weight:600; }
.breadcrumb-link { background:none; border:none; color:var(--saffron); font-size:13px; padding:0; }
.topbar-actions { gap:10px; } .user-chip { gap:10px; padding:4px 10px 4px 4px; border-radius:100px; background:var(--bg); } .user-avatar { width:30px; height:30px; border-radius:50%; background:var(--saffron); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
.user-info { line-height:1.2; } .user-name { font-size:13px; font-weight:600; } .user-role { font-size:11px; color:var(--ink3); }
.app-body { display:flex; flex:1; overflow:hidden; }
.sidebar { width:var(--sidebar-w); flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); padding:16px 12px; display:flex; flex-direction:column; gap:4px; overflow-y:auto; }
.sidebar-section { padding:4px 0; } .sidebar-section + .sidebar-section { border-top:1px solid var(--border-light); margin-top:4px; padding-top:8px; }
.sidebar-label { font-size:10px; font-weight:700; color:var(--ink4); text-transform:uppercase; letter-spacing:.8px; padding:6px 10px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius); background:none; border:none; color:var(--ink2); font-size:13.5px; font-weight:500; width:100%; text-align:left; position:relative; }
.nav-item svg { flex-shrink:0; opacity:.7; } .nav-item span { flex:1; } .nav-item:hover { background:var(--bg); color:var(--ink); } .nav-item.active { background:var(--saffron-light); color:var(--saffron-dark); font-weight:600; }
.nav-children { flex-direction:column; gap:1px; padding-left:10px; border-left:2px solid var(--border-light); margin-left:13px; margin-top:2px; margin-bottom:2px; } .nav-child { font-size:13px; padding:7px 10px; }
.badge-count { font-size:11px; font-weight:700; padding:1px 7px; border-radius:100px; background:var(--bg2); color:var(--ink3); min-width:22px; text-align:center; }
.badge-blue { background:var(--blue-bg); color:var(--blue); } .badge-green { background:var(--green-bg); color:var(--green); } .badge-red { background:var(--red-bg); color:var(--red); } .badge-amber { background:var(--amber-bg); color:var(--amber); }
.sidebar-footer { margin-top:auto; padding:16px 10px 4px; border-top:1px solid var(--border-light); } .footer-line { font-size:13px; color:var(--gold); font-weight:600; font-style:italic; } .footer-sub { font-size:11px; color:var(--ink4); margin-top:2px; }
.main { flex:1; overflow-y:auto; padding:32px; min-width:0; } .view-header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:24px; } .view-title { font-size:24px; line-height:1.2; letter-spacing:-.4px; color:var(--ink); } .view-sub { color:var(--ink3); font-size:13px; margin-top:4px; }
.toggle-switch { position:relative; display:inline-flex; width:38px; height:22px; } .toggle-switch input { opacity:0; width:0; height:0; } .toggle-slider { position:absolute; inset:0; background:var(--border); border-radius:20px; transition:.2s; } .toggle-slider:before { content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 2px #0002; } .toggle-switch input:checked + .toggle-slider { background:var(--teal); } .toggle-switch input:checked + .toggle-slider:before { transform:translateX(16px); }
.notice-language-card { padding:14px; border-radius:14px; }
.notice-language-english { border-color:#D7EEE9; } .notice-language-odia { border-color:#F5E3C4; }
.notice-language-header { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:11px; margin-bottom:18px; }
.notice-language-english .notice-language-header { background:#ECF8F5; } .notice-language-odia .notice-language-header { background:#FFF7E8; }
.notice-language-badge { width:44px; height:44px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:800; flex-shrink:0; }
.notice-language-english .notice-language-badge { background:var(--teal); } .notice-language-odia .notice-language-badge { background:#D98512; }
.notice-language-header h4 { margin:0; color:var(--ink); font-size:17px; } .notice-language-header p { margin:2px 0 0; color:var(--ink3); font-size:12px; }
.notice-language-grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr); gap:24px; align-items:start; padding:0 12px 8px; }
.notice-image-field > label:first-child { display:block; font-size:13px; font-weight:600; color:var(--ink2); margin-bottom:6px; }
.notice-image-dropzone { min-height:155px; padding:18px; border:1.5px dashed var(--border-strong); border-radius:10px; background:var(--surface-2); color:var(--ink3); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:5px; cursor:pointer; transition:.12s; }
.notice-image-dropzone:hover { border-color:var(--teal); background:var(--teal-bg); color:var(--teal-dark); } .notice-image-dropzone strong { color:var(--ink2); font-size:13px; } .notice-image-dropzone span { color:var(--ink4); font-size:11px; }
.notice-image-preview { display:flex; align-items:center; gap:10px; margin-top:10px; padding:7px 9px 7px 7px; border:1px solid var(--border-light); border-radius:9px; background:var(--surface-2); min-width:0; }
.notice-image-preview img { width:72px; height:48px; object-fit:cover; border-radius:6px; background:var(--bg2); flex-shrink:0; } .notice-image-meta { min-width:0; flex:1; display:flex; flex-direction:column; gap:2px; } .notice-image-meta strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:var(--ink2); } .notice-image-meta span { font-size:11px; color:var(--ink4); }
.nf-image-remove { width:28px; height:28px; border:0; border-radius:6px; background:transparent; color:var(--ink3); font-size:22px; line-height:1; } .nf-image-remove:hover { background:var(--red-bg); color:var(--red); }
.notice-meta-card { padding:16px 20px; display:flex; align-items:center; gap:24px; } .notice-meta-title { min-width:125px; display:flex; align-items:center; gap:9px; font-size:15px; font-weight:700; color:var(--ink); } .notice-meta-title svg { color:var(--teal); } .notice-meta-options { display:flex; gap:10px; flex-wrap:wrap; }
@media (max-width:1100px) { .main { padding:24px; } .notice-language-grid { grid-template-columns:1fr; } }
@media (max-width:800px) { .sidebar { width:210px; } .main > div > div[style*="grid-template-columns:1fr 340px"] { grid-template-columns:1fr !important; } .notice-meta-card { align-items:flex-start; flex-direction:column; gap:12px; } }
@media (max-width:600px) { .topbar { padding:0 12px; } .topbar-brand-text, .user-info, .topbar-actions > .btn { display:none; } .sidebar { display:none; } .topbar-toggle { display:inline-flex; } .main { padding:16px; } .view-title { font-size:21px; } .notice-language-grid { padding:0 4px 4px; gap:16px; } .notice-language-card { padding:10px; } }

/* Shared dashboard surfaces */
.login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; position:relative; overflow:hidden; }
.login-bg { position:absolute; inset:0; z-index:0; background:radial-gradient(circle at 15% 25%,#FFE5CD 0%,transparent 40%),radial-gradient(circle at 85% 80%,#FFF0DB 0%,transparent 50%),linear-gradient(135deg,#FFFAF0 0%,#F7F1E5 100%); }
.login-card { position:relative; z-index:1; background:var(--surface); border-radius:20px; padding:48px; width:100%; max-width:460px; box-shadow:0 24px 48px rgba(30,20,14,.18),0 8px 16px rgba(30,20,14,.08); border:1px solid var(--border); }
.login-brand { display:flex; align-items:center; gap:14px; margin-bottom:36px; padding-bottom:24px; border-bottom:1px solid var(--border-light); }
.login-brand .brand-mark { width:48px; height:48px; border-radius:12px; font-size:16px; }
.brand-title { font-weight:700; font-size:16px; color:var(--ink); } .brand-sub { font-size:12px; color:var(--ink3); margin-top:1px; }
.login-heading { font-size:26px; font-weight:700; color:var(--ink); letter-spacing:-.5px; margin-bottom:6px; } .login-sub { font-size:14px; color:var(--ink3); margin-bottom:28px; line-height:1.55; }
.login-hint { font-size:12px; color:var(--ink4); margin-top:18px; line-height:1.6; } .link-action { background:none; border:0; color:var(--saffron); text-decoration:underline; }
.btn-block { width:100%; padding:13px 16px; font-size:15px; }
.alert-success { background:var(--green-bg); color:var(--green); border:1px solid #B7E6CB; } .alert.show { display:block; }
.dashboard-grid { display:grid; gap:20px; } .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; } .stat-label { color:var(--ink3); font-size:12px; } .stat-value { color:var(--ink); font-size:28px; font-weight:700; margin-top:6px; }
.table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:auto; } table { width:100%; border-collapse:collapse; } th { background:var(--surface-2); color:var(--ink3); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; text-align:left; padding:12px 14px; white-space:nowrap; } td { color:var(--ink2); padding:13px 14px; border-top:1px solid var(--border-light); vertical-align:middle; } tbody tr:hover { background:#FFFCF8; }
.status-badge { display:inline-flex; align-items:center; padding:4px 9px; border-radius:20px; font-size:11px; font-weight:600; } .search-box { display:flex; align-items:center; gap:8px; border:1.5px solid var(--border); border-radius:8px; padding:8px 12px; background:var(--surface); } .search-box input { border:0; outline:0; background:transparent; min-width:0; }
.tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); } .tab { background:none; border:0; padding:10px 14px; color:var(--ink3); font-weight:600; border-bottom:2px solid transparent; } .tab.active { color:var(--saffron-dark); border-bottom-color:var(--saffron); }
.modal-backdrop { position:fixed; inset:0; background:rgba(30,20,14,.45); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; } .modal { width:min(640px,100%); max-height:90vh; overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:0 24px 64px rgba(30,20,14,.2); } .modal-header { display:flex; justify-content:space-between; gap:16px; padding:20px 24px; border-bottom:1px solid var(--border-light); } .modal-body { padding:24px; } .modal-title { font-size:18px; color:var(--ink); } .modal-desc { color:var(--ink3); font-size:13px; margin-top:3px; } .modal-close { background:none; border:0; color:var(--ink3); font-size:22px; }
.drawer-backdrop { position:fixed; inset:0; background:rgba(30,20,14,.35); z-index:90; } .drawer { position:fixed; top:0; right:0; bottom:0; width:min(560px,100%); background:var(--surface); z-index:91; box-shadow:-12px 0 32px rgba(30,20,14,.14); overflow:auto; } .drawer-header { display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid var(--border); } .drawer-body { padding:24px; }
.toast-stack { position:fixed; right:20px; bottom:20px; z-index:200; display:flex; flex-direction:column; gap:8px; } .toast { padding:12px 16px; border-radius:9px; background:var(--ink); color:#fff; box-shadow:var(--shadow-md); font-size:13px; } .toast.success { background:var(--green); } .toast.error { background:var(--red); }
@media (max-width:600px) { .login-card { padding:28px 22px; } .view-header { flex-direction:column; } .topbar-actions { margin-left:auto; } .table-wrap { border-radius:8px; } }

.drawer-overlay, .modal-overlay { position:fixed; inset:0; display:none; z-index:90; }
.drawer-overlay { align-items:stretch; justify-content:flex-end; background:rgba(30,20,14,.35); }
#drawer-overlay:not(.open), #modal-overlay:not(.open) { display:none !important; }
.drawer-overlay.open, .modal-overlay.open { display:flex; }
.drawer { width:min(620px,100%); height:100%; background:var(--surface); box-shadow:-12px 0 32px rgba(30,20,14,.18); display:flex; flex-direction:column; overflow:hidden; }
.drawer-header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 24px; border-bottom:1px solid var(--border); flex-shrink:0; }
.drawer-header-main { display:flex; align-items:center; gap:12px; min-width:0; }
.drawer-avatar { width:44px; height:44px; border-radius:50%; background:var(--saffron-light); color:var(--saffron-dark); background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; }
.drawer-title { color:var(--ink); font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.drawer-sub { color:var(--ink3); font-size:12px; margin-top:3px; }
.drawer-tabs { display:flex; gap:4px; padding:0 24px; border-bottom:1px solid var(--border); flex-shrink:0; }
.drawer-tab { background:none; border:0; border-bottom:2px solid transparent; color:var(--ink3); padding:12px 10px; font-size:13px; font-weight:600; }
.drawer-tab:hover { color:var(--ink); }
.drawer-tab.active { color:var(--saffron-dark); border-bottom-color:var(--saffron); }
.drawer-body { flex:1; overflow:auto; padding:24px; }
.drawer-footer { display:flex; gap:8px; padding:16px 24px; border-top:1px solid var(--border); background:var(--surface-2); flex-shrink:0; }
.detail-section { margin-bottom:24px; }
.detail-section:last-child { margin-bottom:0; }
.detail-section-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.detail-section-title { color:var(--ink2); font-size:13px; font-weight:700; }
.detail-section-line { height:1px; background:var(--border-light); flex:1; }
.detail-card { background:var(--surface-2); border:1px solid var(--border-light); border-radius:10px; padding:4px 14px; }
.detail-row { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid var(--border-light); font-size:13px; }
.detail-row:last-child { border-bottom:0; }
.detail-row-label { color:var(--ink3); }
.detail-row-value { color:var(--ink); text-align:right; font-weight:500; }
.status-timeline { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:24px; }
.status-step { flex:1; position:relative; text-align:center; color:var(--ink4); font-size:11px; }
.status-step:not(:last-child)::after { content:''; position:absolute; top:12px; left:calc(50% + 14px); right:calc(-50% + 14px); height:2px; background:var(--border); }
.status-step.done, .status-step.active { color:var(--teal); }
.status-step.done:not(:last-child)::after { background:var(--teal); }
.status-step .dot { position:relative; z-index:1; width:24px; height:24px; margin:0 auto 5px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--border-light); color:var(--ink3); font-weight:700; }
.status-step.done .dot, .status-step.active .dot { background:var(--teal); color:#fff; }
.status-step.error { color:var(--red); }
.status-step.error .dot { background:var(--red); color:#fff; }
.photo-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.photo-tile { min-height:120px; border-radius:9px; background:var(--bg2) center/cover no-repeat; display:flex; align-items:flex-end; overflow:hidden; cursor:pointer; }
.photo-tile-label { width:100%; padding:8px; background:linear-gradient(transparent,rgba(0,0,0,.7)); color:#fff; font-size:11px; font-weight:600; }

<body>

<!-- ── LOGIN ── -->
<section id="login-screen" class="login-screen">
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark">JN</div>
      <div>
        <div class="brand-title">Pratihari Nijog</div>
        <div class="brand-sub">Shree Jagannatha Temple, Puri</div>
      </div>
    </div>
    <h1 class="login-heading">Admin Sign In</h1>
    <p class="login-sub">Sign in with your administrator credentials to manage sebayat applications.</p>
    <div id="login-error" class="alert alert-error"></div>
    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="email-input">Email address</label>
        <input id="email-input" type="email" placeholder="admin@example.com" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password-input">Password</label>
        <input id="password-input" type="password" placeholder="Enter your password" required autocomplete="current-password" />
      </div>
      <button class="btn btn-primary btn-block" id="login-btn" type="submit">Sign In</button>
    </form>
    <p class="login-hint">Forgot your password? <button type="button" class="link-action" id="forgot-link">Send reset email</button></p>
  </div>
</section>
